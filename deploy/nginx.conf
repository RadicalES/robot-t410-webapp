# Robot-T430 NGINX Configuration
# Place in /etc/nginx/sites-available/robot-t430
#
# Setup:
#   sudo apt-get install apache2-utils
#   sudo htpasswd -c /etc/nginx/.htpasswd admin
#   sudo chmod 660 /etc/nginx/.htpasswd
#   sudo chown root:www-data /etc/nginx/.htpasswd

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /var/www/html;
    index index.html;

    server_name _;

    # A release replaces these files underneath a running browser, and nothing
    # here told the browser that: with no Cache-Control it caches heuristically
    # and keeps serving the old page. A terminal kept robot.js from before a
    # section was removed and then died on an element that no longer existed.
    #
    # no-cache is not "do not cache": it means revalidate, which the ETag makes
    # a 304 and a few bytes. At server level so every location inherits it.
    add_header Cache-Control "no-cache" always;

    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;

    # Web UI - Basic Authentication for anyone off the device.
    #
    # The kiosk browser runs ON this terminal and loads the local web UI with
    # its Home button; prompting the operator for a password on their own
    # screen is neither useful nor answerable, since the credentials are an
    # admin's. "satisfy any" lets loopback through and still requires auth from
    # every other address, so remote access is protected exactly as before.
    location / {
        satisfy any;
        allow 127.0.0.1;
        allow ::1;
        deny  all;

        auth_basic "Robot-T430";
        auth_basic_user_file /etc/nginx/.htpasswd;

        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Content-Length' '0';
            return 204;
        }
        try_files $uri $uri/ =404;
    }

    # Test page - no auth
    location /test/ {
        auth_basic off;
        alias /var/www/test/;
        try_files $uri $uri/ =404;
    }

    # CGI scripts - no auth
    location /cgi/ {
        auth_basic off;
        gzip off;
        fastcgi_pass unix:/var/run/fcgiwrap.socket;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www;
    }
}
