<div id="layerComms" class="layer">

	<div class="card">
		<legend>SCADA Server</legend>
		<div class="w3-row">
			<div class="w3-col l12 m12 irow" style="display:flex; align-items:center; gap:0.5em;">
				<label class="s-label" style="white-space:nowrap;">Connection:</label>
				<span id="scada_dot" style="display:inline-block;width:0.8em;height:0.8em;border-radius:50%;background:#9e9e9e;flex-shrink:0;"></span>
				<span id="scada_state">Checking&hellip;</span>
			</div>
		</div>
		<div class="w3-row">
			<div class="w3-col l12 m12 irow" style="display:flex; align-items:center; gap:0.5em;">
				<label class="s-label" style="white-space:nowrap;">Last contact:</label>
				<span id="scada_last">&mdash;</span>
			</div>
		</div>
		<div class="w3-row">
			<div class="w3-col l12 m12 irow" style="display:flex; align-items:center; gap:0.5em;">
				<label class="s-label" style="white-space:nowrap;">Station:</label>
				<span id="scada_station">&mdash;</span>
			</div>
		</div>
		<div class="w3-row">
			<div class="w3-col l12 m12 irow" style="display:flex; align-items:baseline; gap:0.5em;">
				<label class="s-label" style="white-space:nowrap;">Server URL:</label>
				<span id="scada_url" style="word-break:break-all; min-width:0;">&mdash;</span>
			</div>
		</div>
	</div>

	<form id="formComms" action="" method="post" onsubmit="return saveCommsCfg()">

		<div class="card">
			<legend>Network Interfaces</legend>

			<div id="layerComms_wired" style="margin-top: 0.5em;">
				<h3 id="net_wired_name"></h3>
				<div class="w3-row">
					<div class="w3-col l6 m6 irow">
						<input class="w3-check small-check" type="checkbox" id="wired_dhcp" value="1" onclick="setNetState('wired',this.checked);" />
						<label>DHCP</label>
					</div>
				</div>
				<div class="w3-row">
					<div class="w3-col l6 m6 irow">
						<label>MAC Address:</label>
						<input class="w3-input input-short" name="wired_mac" disabled id="wired_mac" value="" />
					</div>
					<div class="w3-col l6 m6 irow">
						<label>IP Address:</label>
						<input class="w3-input input-short" id="wired_ipa" value="" />
					</div>
				</div>
				<div class="w3-row">
					<div class="w3-col l6 m6 irow">
						<label>Subnet Mask:</label>
						<input class="w3-input input-short" id="wired_nm" value="" />
					</div>
					<div class="w3-col l6 m6 irow">
						<label>Default Gateway:</label>
						<input class="w3-input input-short" id="wired_gw" value="" />
					</div>
				</div>
				<div class="w3-row">
					<div class="w3-col l6 m6 irow">
						<label>DNS Server:</label>
						<input class="w3-input input-short" id="wired_dns" value="" />
					</div>
				</div>
			</div>
		</div>

		<div class="card">
			<legend>Time</legend>
			<div class="w3-row">
				<div class="w3-col l6 m6 irow">
					<label>NTP Server:</label>
					<input class="w3-input input-short" id="system_ntp" value="" />
				</div>
			</div>
		</div>

		<div class="card">
			<legend>Websocket Servers</legend>
			<div id="layerComms_cardreader" style="margin-top: 0.5em;">
				<h3>Card Reader</h3>
				<div class="w3-row">
					<div class="w3-col l6 m6 irow">
						<input class="w3-check small-check" type="checkbox" id="cardreader_enabled" />
						<label>Enabled</label>
						<!-- Enabled is "starts on boot"; this is whether it is
						     running now. They can differ, and hiding that is
						     how a terminal ends up with a card reader that
						     works until the next reboot. -->
						<span id="cardreader_state" class="svc-state">&mdash;</span>
					</div>
					<div class="w3-col l6 m6 irow">
						<input class="w3-check small-check" type="checkbox" id="cardreader_foreign_connect"/>
						<label>Allow Foreign Connections</label>
					</div>
				</div>
				<div class="w3-row">
					<div class="w3-col l6 m6 irow">
						<label>Websocket Port</label>
						<input class="w3-input input-short" id="cardreader_server_port" value="8100" />
					</div>
					<div class="w3-col l6 m6 irow">
						<label>Output Format:</label>
						<input class="w3-input input-short" id="cardreader_output_format" value="[CARD]:%s" />
					</div>
				</div>
			</div>
		</div>

		<div style="display:flex; gap:0.8em; flex-wrap:wrap;">
			<button class="btn btn-danger" type="button" onclick="resetCommsCfg()">Reset Settings</button>
			<button class="btn btn-primary" type="submit">Save Settings</button>
		</div>

		<script type="text/javascript">
			const ipa = new LiveValidation( 'wired_ipa', {onlyOnSubmit: false, validMessage: 'OK' } );
			ipa.add( Validate.IPAddress );
			ipa.add( Validate.Presence );

			const sn = new LiveValidation( 'wired_nm', {onlyOnSubmit: false, validMessage: 'OK' } );
			sn.add( Validate.IPAddress );
			sn.add( Validate.Presence );

			const gw = new LiveValidation( 'wired_gw', {onlyOnSubmit: false, validMessage: 'OK' } );
			gw.add( Validate.IPAddress );
			gw.add( Validate.Presence );

			// wired_dns had never actually been validated: its validator was
			// created and then the rules were added to wired_ntp twice.
			const dns = new LiveValidation( 'wired_dns', {onlyOnSubmit: false, validMessage: 'OK' } );
			dns.add( Validate.IPAddress );
			dns.add( Validate.Presence );

			// A time server is usually named, not numbered - pool.ntp.org and
			// the like - so it is not held to an IP address.
			const ntp = new LiveValidation( 'system_ntp', {onlyOnSubmit: false, validMessage: 'OK' } );
			ntp.add( Validate.Length, { maximum: 253 } );
		</script>
	</form>
</div>
